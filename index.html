
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>Japa Fit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Japa <span>Fit.</span></h1>
    <p class="sub">Sua evolução começa aqui.</p>
  </header>

  <main>
    <section class="card">
      <h2>📊 Calculadora de IMC</h2>

      <label for="peso">Peso atual (kg)</label>
      <input id="peso" type="number" step="0.1" placeholder="Ex.: 92">

      <label for="altura">Altura (cm)</label>
      <input id="altura" type="number" placeholder="Ex.: 174">

      <button onclick="calcular()">Calcular meu IMC</button>

      <div class="result" id="resultado"></div>
    </section>

    <section class="card">
      <h2>🎯 Seu objetivo</h2>
      <p class="sub">
        Cada passo conta. Em breve você poderá acompanhar
        suas metas, alimentação, água e atividades físicas.
      </p>
      <p class="green">Projeto Japa Fit — versão 0.1</p>
    </section>
  </main>

  <footer>Feito para evoluir. 💪</footer>

  <script src="script.js"></script>
</body>
</html>
